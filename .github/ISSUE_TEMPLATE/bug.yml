name: Bug report
description: Something doesn't work as expected.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in everything below so we can reproduce.
        For security vulnerabilities, do NOT use this form — see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: loopbridge version
      description: From "Settings → About" or `loopbridge --version`.
      placeholder: 'e.g. 0.2.0'
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Confluence backend
      options:
        - Data Center
        - Cloud
        - N/A (issue not Confluence-related)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux (AppImage)
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction. Include the space key / page id if relevant.
      placeholder: |
        1. Open the app
        2. Configure Confluence DC with PAT
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log snippet
      description: |
        From `userData/logs/loopbridge-*.jsonl`. Settings → Open log folder.
        REDACT credentials, tokens, and any internal hostnames before pasting.
      render: jsonl

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: VPN? Proxy? Custom CA bundle? Internal macro the converter chokes on?
