version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-vite
          - electron-store
          - electron-updater
          - electron-log
          - '@electron-toolkit/*'
      radix:
        patterns:
          - '@radix-ui/*'
      eslint:
        patterns:
          - eslint
          - '@typescript-eslint/*'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - react-router-dom
      vite:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - tailwind-merge
          - tailwindcss-animate
          - autoprefixer
          - postcss
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'
      tanstack:
        patterns:
          - '@tanstack/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
