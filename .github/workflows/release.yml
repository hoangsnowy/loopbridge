name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows installer (NSIS + MSI)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify package.json matches tag
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) {
            Write-Error "package.json version ($pkg) does not match tag ($tag). Bump package.json before tagging."
            exit 1
          }
          Write-Host "Version check OK: $pkg"

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps (with native rebuild)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm test

      - name: Build bundles
        run: npm run build

      - name: Generate SBOM (CycloneDX, npm-scoped)
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --omit dev --output-format JSON --output-file sbom.cdx.json --spec-version 1.5

      # `pretest` left better-sqlite3 on the Node ABI; switch back to the
      # Electron ABI before packaging so the shipped binary loads.
      - name: Rebuild native deps for Electron
        run: npx electron-builder install-app-deps

      - name: Package Windows installer (NSIS + MSI, unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis msi --publish never

      # Code signing — pick one path by setting the right secret(s).
      # Without any, the build ships unsigned (SmartScreen will warn on first run).
      #
      # Path 1: SSL.com / Sectigo / DigiCert cloud HSM with a .pfx-style flow.
      #   Set CSC_LINK (base64 of cert) + CSC_KEY_PASSWORD.
      #   electron-builder picks them up automatically; no extra step.
      #
      # Path 2: Azure Key Vault HSM.
      #   Uncomment the block below and set AZURE_* + KV_CERT_NAME secrets.
      #
      # - name: Sign installer (Azure Key Vault HSM)
      #   if: ${{ env.AZURE_KEY_VAULT_URI != '' }}
      #   env:
      #     AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      #     AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      #     AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      #     AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     KV_CERT_NAME: ${{ secrets.KV_CERT_NAME }}
      #   shell: pwsh
      #   run: |
      #     dotnet tool install --global AzureSignTool
      #     Get-ChildItem release -Recurse -Include *.exe,*.msi | ForEach-Object {
      #       AzureSignTool sign -kvu $env:AZURE_KEY_VAULT_URI `
      #         -kvi $env:AZURE_CLIENT_ID -kvt $env:AZURE_TENANT_ID `
      #         -kvs $env:AZURE_CLIENT_SECRET -kvc $env:KV_CERT_NAME `
      #         -tr http://timestamp.digicert.com -td sha256 -fd sha256 -v $_.FullName
      #     }

      - name: Compute SHA256 for installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA256: $sha"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/**/*.exe
            release/**/*.msi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: loopbridge-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.blockmap
            sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish draft GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: loopbridge-windows-${{ github.ref_name }}
          path: dist/windows

      - name: List downloaded files
        run: find dist -type f | sort

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: loopbridge ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/windows/**/*.exe
            dist/windows/**/*.msi
            dist/windows/**/*.blockmap
            dist/windows/sbom.cdx.json
          fail_on_unmatched_files: true
