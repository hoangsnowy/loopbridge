appId: io.loopbridge.app
productName: loopbridge
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/.DS_Store'
asarUnpack:
  - '**/*.node'
extraResources:
  - from: resources
    to: resources
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
  signtoolOptions:
    publisherName: loopbridge
    signingHashAlgorithms: [sha256]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: loopbridge
publish:
  provider: github
  owner: hoangsnowy
  repo: loopbridge
  releaseType: release
  channel: stable
